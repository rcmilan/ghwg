<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading...</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; font: 16px monospace; }
</style>
</head>
<body>
<div id="loading">Loading...</div>
<script src="wasm_exec.js"></script>
<script>
// Ebitengine makes its own canvas (filling this page, letterboxed) and focuses it on click, so keys work inside the itch.io iframe.
const msg = document.getElementById("loading");
if (!matchMedia("(any-pointer: fine)").matches && matchMedia("(any-pointer: coarse)").matches) { // touch only: the game needs a keyboard
  msg.textContent = "This game is played with a keyboard. Please open it on a computer.";
} else {
  const go = new Go();
  const args = new URLSearchParams(location.search).get("args"); // dev: main's flags, e.g. ?args=-busy -ghost
  const argv = args ? args.trim().split(/\s+/) : [];
  if (new URLSearchParams(location.search).has("story")) argv.push("-story"); // story mode: ?story
  if (argv.length) go.argv = ["js", ...argv];
  // itch.io serves .gz files without a Content-Encoding, so unpack it here (3.8 MB instead of 15 MB).
  // Not instantiateStreaming: it works whatever MIME type the host serves with.
  fetch("game.wasm.gz")
    .then(r => { if (!r.ok) throw new Error(r.status); return new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer(); })
    .then(b => WebAssembly.instantiate(b, go.importObject))
    .then(({ instance }) => { msg.remove(); go.run(instance); })
    .catch(e => { msg.textContent = "Could not load the game: " + e; });
}
</script>
</body>
</html>
